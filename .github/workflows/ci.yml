name: CI

on:
  # Run CI on pushes to main and develop
  push:
    branches:
      - main
      - develop

  # Run CI on pull requests targeting main and develop
  pull_request:
    branches:
      - main
      - develop

# Cancel in-progress runs if a new commit is pushed to the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠 Setup Node.js with cache
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 📦 Install npm dependencies
        run: npm ci

      - name: 🔄 Sync SvelteKit types
        run: npm run prepare

      - name: ✅ TypeScript type checking
        run: npm run check

      - name: 🧹 Format & lint check
        run: npm run lint

      - name: 🏗 Build SvelteKit project
        run: npm run build

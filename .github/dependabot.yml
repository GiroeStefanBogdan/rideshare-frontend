version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Europe/Bucharest'
    open-pull-requests-limit: 10
    rebase-strategy: 'auto'
    commit-message:
      prefix: 'upgrade'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'automated-pr'
